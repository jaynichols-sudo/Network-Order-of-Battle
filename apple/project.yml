# Native Apple apps for Northfix. Generate the Xcode project with:
#   brew install xcodegen && cd apple && xcodegen generate
# CI sets APPLE_TEAM_ID and the OOB_PROFILE_* names for App Store signing.
name: Northfix
options:
  bundleIdPrefix: com.jaynichols
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Northfix:
    type: application
    platform: iOS
    sources:
      - path: Northfix
        excludes:
          - "Resources/**"
          - "Fonts/**"
          - "Info.plist"
          - "*.entitlements"
      - path: Northfix/Resources
        buildPhase: resources
      - path: Northfix/Fonts
        buildPhase: resources
      - path: Shared
      - path: NoteText
    info:
      path: Northfix/Info.plist
      properties:
        CFBundleDisplayName: Northfix
        CFBundleName: Northfix
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NorthfixConnectURL: $(CONNECT_URL)
        NorthfixTeamURL: $(TEAM_URL)
        NorthfixMSClientID: $(MS_CLIENT_ID)
        NorthfixGoogleClientID: $(GOOGLE_CLIENT_ID)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.business
        LSRequiresIPhoneOS: true
        NSContactsUsageDescription: Northfix matches your LinkedIn connections to your contacts on this device to work out roughly where they are, so you can see who's nearby when you travel. Nothing is uploaded.
        NSRemindersFullAccessUsageDescription: With Reminders on, Northfix adds your follow-ups to a Northfix list in Apple Reminders and marks them done when you check them off there. Nothing is uploaded.
        NSCalendarsFullAccessUsageDescription: Northfix reads your calendar on this device to brief you before meetings with people you know and to spot upcoming trips. Nothing is uploaded.
        NSCameraUsageDescription: Northfix uses the camera to scan business cards and badges at events. The picture is read on this device and not kept.
        NSLocationWhenInUseUsageDescription: Northfix uses your location to show which of your connections are nearby.
        NSLocationAlwaysAndWhenInUseUsageDescription: With arrival alerts on, Northfix notices when you land in a new city and tells you who you know there. Your location is only used on this device.
        LSSupportsOpeningDocumentsInPlace: true
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
          - GeistMono-Medium.ttf
          - GeistMono-SemiBold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.jaynichols.networkoob
            CFBundleURLSchemes:
              - northfix
              - bearings
        CFBundleDocumentTypes:
          - CFBundleTypeName: LinkedIn data export
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
              - public.comma-separated-values-text
          - CFBundleTypeName: Northfix backup
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
          - CFBundleTypeName: Meeting notes
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - net.daringfireball.markdown
              - public.rtf
              - com.adobe.pdf
              - public.image
    entitlements:
      path: Northfix/Northfix.entitlements
      properties:
        com.apple.developer.icloud-container-environment: Production
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.jaynichols.networkoob
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.jaynichols.networkoob
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jaynichols.networkoob.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaynichols.networkoob
        PRODUCT_NAME: Northfix
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MAIN_APP"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Night AppIcon-Paper AppIcon-Field"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: ${OOB_PROFILE_APP}
        "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": ${OOB_PROFILE_APPMAC}
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Northfix/Northfix-mac.entitlements
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        MACOSX_DEPLOYMENT_TARGET: "15.0"
    dependencies:
      - target: NorthfixHomeWidgets
        embed: true
      - target: NorthfixShare
        embed: true
        platformFilter: iOS
      - target: NorthfixWatch
        embed: true
        platformFilter: iOS
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    scheme:
      testTargets:
        - NorthfixUITests

  NorthfixShare:
    type: app-extension
    platform: iOS
    sources:
      - path: NorthfixShare
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
      - path: NoteText
    info:
      path: NorthfixShare/Info.plist
      properties:
        CFBundleDisplayName: Northfix
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $e, SUBQUERY($e.attachments, $a,
              ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text" ||
              ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.rtf" ||
              ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf" ||
              ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image").@count >= 1).@count >= 1
    entitlements:
      path: NorthfixShare/NorthfixShare.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jaynichols.networkoob.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaynichols.networkoob.share
        PRODUCT_NAME: NorthfixShare
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: ${OOB_PROFILE_SHARE}
        SKIP_INSTALL: YES

  NorthfixUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NorthfixUITests
    dependencies:
      - target: Northfix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaynichols.networkoob.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Northfix

  NorthfixWatch:
    type: application
    platform: watchOS
    sources:
      - path: NorthfixWatch
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    info:
      path: NorthfixWatch/Info.plist
      properties:
        CFBundleDisplayName: Northfix
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.jaynichols.networkoob
        WKRunsIndependentlyOfCompanionApp: false
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: NorthfixWatch/NorthfixWatch.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jaynichols.networkoob.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaynichols.networkoob.watchkitapp
        PRODUCT_NAME: Northfix
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: ${OOB_PROFILE_WATCH}
        SKIP_INSTALL: YES
    dependencies:
      - target: NorthfixWidgets
        embed: true

  NorthfixWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: NorthfixWidgets
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    info:
      path: NorthfixWidgets/Info.plist
      properties:
        CFBundleDisplayName: Northfix
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NorthfixWidgets/NorthfixWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jaynichols.networkoob.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaynichols.networkoob.watchkitapp.widgets
        PRODUCT_NAME: NorthfixWidgets
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: ${OOB_PROFILE_WIDGETS}
        SKIP_INSTALL: YES

  NorthfixHomeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NorthfixHomeWidgets
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
      - path: Northfix/Fonts
        buildPhase: resources
    info:
      path: NorthfixHomeWidgets/Info.plist
      properties:
        CFBundleDisplayName: Northfix
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
          - GeistMono-Medium.ttf
          - GeistMono-SemiBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NorthfixHomeWidgets/NorthfixHomeWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jaynichols.networkoob.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaynichols.networkoob.widgets
        PRODUCT_NAME: NorthfixHomeWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: ${OOB_PROFILE_HOMEWIDGETS}
        "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": ${OOB_PROFILE_HOMEWIDGETSMAC}
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": NorthfixHomeWidgets/NorthfixHomeWidgets-mac.entitlements
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SKIP_INSTALL: YES
