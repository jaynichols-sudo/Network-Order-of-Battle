# Native Apple apps for Bearings. Generate the Xcode project with:
#   brew install xcodegen && cd apple && xcodegen generate
# CI sets APPLE_TEAM_ID and the OOB_PROFILE_* names for App Store signing.
name: Bearings
options:
  bundleIdPrefix: com.jaynichols
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Bearings:
    type: application
    platform: iOS
    sources:
      - path: Bearings
        excludes:
          - "Resources/**"
          - "Fonts/**"
          - "Info.plist"
          - "*.entitlements"
      - path: Bearings/Resources
        buildPhase: resources
      - path: Bearings/Fonts
        buildPhase: resources
      - path: Shared
    info:
      path: Bearings/Info.plist
      properties:
        CFBundleDisplayName: Bearings
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.business
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: LinkedIn data export
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
              - public.comma-separated-values-text
          - CFBundleTypeName: Bearings backup
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
    entitlements:
      path: Bearings/Bearings.entitlements
      properties:
        com.apple.developer.icloud-container-environment: Production
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.jaynichols.networkoob
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.jaynichols.networkoob
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaynichols.networkoob
        PRODUCT_NAME: Bearings
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: ${OOB_PROFILE_APP}
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
    dependencies:
      - target: BearingsWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    scheme: {}

  BearingsWatch:
    type: application
    platform: watchOS
    sources:
      - path: BearingsWatch
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    info:
      path: BearingsWatch/Info.plist
      properties:
        CFBundleDisplayName: Bearings
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.jaynichols.networkoob
        WKRunsIndependentlyOfCompanionApp: false
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: BearingsWatch/BearingsWatch.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jaynichols.networkoob.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaynichols.networkoob.watchkitapp
        PRODUCT_NAME: Bearings
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: ${OOB_PROFILE_WATCH}
        SKIP_INSTALL: YES
    dependencies:
      - target: BearingsWidgets
        embed: true

  BearingsWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: BearingsWidgets
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    info:
      path: BearingsWidgets/Info.plist
      properties:
        CFBundleDisplayName: Bearings
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BearingsWidgets/BearingsWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jaynichols.networkoob.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaynichols.networkoob.watchkitapp.widgets
        PRODUCT_NAME: BearingsWidgets
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: ${OOB_PROFILE_WIDGETS}
        SKIP_INSTALL: YES
