# Native Apple apps for Bearings. Generate the Xcode project with:
#   brew install xcodegen && cd apple && xcodegen generate
# CI sets APPLE_TEAM_ID and the OOB_PROFILE_* names for App Store signing.
name: Bearings
options:
  bundleIdPrefix: com.jaynichols
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Bearings:
    type: application
    platform: iOS
    sources:
      - path: Bearings
        excludes:
          - "Resources/**"
          - "Fonts/**"
          - "Info.plist"
          - "*.entitlements"
      - path: Bearings/Resources
        buildPhase: resources
      - path: Bearings/Fonts
        buildPhase: resources
      - path: Shared
      - path: NoteText
    info:
      path: Bearings/Info.plist
      properties:
        CFBundleDisplayName: Bearings
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BearingsConnectURL: $(CONNECT_URL)
        BearingsMSClientID: $(MS_CLIENT_ID)
        BearingsGoogleClientID: $(GOOGLE_CLIENT_ID)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.business
        LSRequiresIPhoneOS: true
        NSContactsUsageDescription: Bearings matches your LinkedIn connections to your contacts on this device to work out roughly where they are, so you can see who's nearby when you travel. Nothing is uploaded.
        NSRemindersFullAccessUsageDescription: With Reminders on, Bearings adds your follow-ups to a Bearings list in Apple Reminders and marks them done when you check them off there. Nothing is uploaded.
        NSCalendarsFullAccessUsageDescription: Bearings reads your calendar on this device to brief you before meetings with people you know and to spot upcoming trips. Nothing is uploaded.
        NSCameraUsageDescription: Bearings uses the camera to scan business cards and badges at events. The picture is read on this device and not kept.
        NSLocationWhenInUseUsageDescription: Bearings uses your location to show which of your connections are nearby.
        NSLocationAlwaysAndWhenInUseUsageDescription: With arrival alerts on, Bearings notices when you land in a new city and tells you who you know there. Your location is only used on this device.
        LSSupportsOpeningDocumentsInPlace: true
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
          - GeistMono-Medium.ttf
          - GeistMono-SemiBold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.jaynichols.networkoob
            CFBundleURLSchemes:
              - bearings
        CFBundleDocumentTypes:
          - CFBundleTypeName: LinkedIn data export
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
              - public.comma-separated-values-text
          - CFBundleTypeName: Bearings backup
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
          - CFBundleTypeName: Meeting notes
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - net.daringfireball.markdown
              - public.rtf
              - com.adobe.pdf
              - public.image
    entitlements:
      path: Bearings/Bearings.entitlements
      properties:
        com.apple.developer.icloud-container-environment: Production
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.jaynichols.networkoob
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.jaynichols.networkoob
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jaynichols.networkoob.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaynichols.networkoob
        PRODUCT_NAME: Bearings
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MAIN_APP"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Night AppIcon-Paper AppIcon-Field"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: ${OOB_PROFILE_APP}
        "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": ${OOB_PROFILE_APPMAC}
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Bearings/Bearings-mac.entitlements
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        MACOSX_DEPLOYMENT_TARGET: "15.0"
    dependencies:
      - target: BearingsHomeWidgets
        embed: true
      - target: BearingsShare
        embed: true
        platformFilter: iOS
      - target: BearingsWatch
        embed: true
        platformFilter: iOS
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    scheme:
      testTargets:
        - BearingsUITests

  BearingsShare:
    type: app-extension
    platform: iOS
    sources:
      - path: BearingsShare
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
      - path: NoteText
    info:
      path: BearingsShare/Info.plist
      properties:
        CFBundleDisplayName: Bearings
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $e, SUBQUERY($e.attachments, $a,
              ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text" ||
              ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.rtf" ||
              ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf" ||
              ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image").@count >= 1).@count >= 1
    entitlements:
      path: BearingsShare/BearingsShare.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jaynichols.networkoob.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaynichols.networkoob.share
        PRODUCT_NAME: BearingsShare
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: ${OOB_PROFILE_SHARE}
        SKIP_INSTALL: YES

  BearingsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BearingsUITests
    dependencies:
      - target: Bearings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaynichols.networkoob.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Bearings

  BearingsWatch:
    type: application
    platform: watchOS
    sources:
      - path: BearingsWatch
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    info:
      path: BearingsWatch/Info.plist
      properties:
        CFBundleDisplayName: Bearings
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.jaynichols.networkoob
        WKRunsIndependentlyOfCompanionApp: false
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: BearingsWatch/BearingsWatch.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jaynichols.networkoob.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaynichols.networkoob.watchkitapp
        PRODUCT_NAME: Bearings
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: ${OOB_PROFILE_WATCH}
        SKIP_INSTALL: YES
    dependencies:
      - target: BearingsWidgets
        embed: true

  BearingsWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: BearingsWidgets
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    info:
      path: BearingsWidgets/Info.plist
      properties:
        CFBundleDisplayName: Bearings
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BearingsWidgets/BearingsWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jaynichols.networkoob.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaynichols.networkoob.watchkitapp.widgets
        PRODUCT_NAME: BearingsWidgets
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: ${OOB_PROFILE_WIDGETS}
        SKIP_INSTALL: YES

  BearingsHomeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BearingsHomeWidgets
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
      - path: Bearings/Fonts
        buildPhase: resources
    info:
      path: BearingsHomeWidgets/Info.plist
      properties:
        CFBundleDisplayName: Bearings
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
          - GeistMono-Medium.ttf
          - GeistMono-SemiBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BearingsHomeWidgets/BearingsHomeWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jaynichols.networkoob.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaynichols.networkoob.widgets
        PRODUCT_NAME: BearingsHomeWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: ${OOB_PROFILE_HOMEWIDGETS}
        "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": ${OOB_PROFILE_HOMEWIDGETSMAC}
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": BearingsHomeWidgets/BearingsHomeWidgets-mac.entitlements
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SKIP_INSTALL: YES
