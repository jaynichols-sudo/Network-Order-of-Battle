<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F3F6">
<title>Bearings</title>
<script>
  // Set the appearance before first paint so there's no flash.
  (function(){ try { var p = JSON.parse(localStorage.getItem('oob.prefs') || '{}').theme || 'system';
    var dark = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    if (p !== 'system') document.documentElement.dataset.theme = p;
    document.documentElement.dataset.scheme = dark ? 'dark' : 'light'; } catch (e) {} })();
</script>
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
