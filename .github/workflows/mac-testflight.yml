name: Bearings Mac → TestFlight

on:
  # run by hand from the Actions tab: Mac runners use build minutes ten times faster
  workflow_dispatch:

concurrency:
  group: mac-testflight
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build shared engine
        run: |
          npm ci
          npm run build
          brew install xcodegen >/dev/null
      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8_RAW: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          # Normalize the pasted key: tolerate lost line breaks, CRLF, smart quotes or stray spaces.
          python3 - "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" <<'PY'
          import os, re, sys, textwrap
          raw = os.environ["ASC_KEY_P8_RAW"]
          body = re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          if len(body) < 100:
              sys.exit("ASC_KEY_P8 secret looks empty or truncated (%d base64 chars)" % len(body))
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n"
          open(sys.argv[1], "w").write(pem)
          print("API key normalized: %d base64 chars" % len(body))
          PY
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Create temporary Mac App Store signing
        env:
          BUNDLE_IDS: APPMAC=com.jaynichols.networkoob,HOMEWIDGETSMAC=com.jaynichols.networkoob.widgets
          PROFILE_TYPE: MAC_CATALYST_APP_STORE
          INSTALLER_CERT: "1"
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet --user pyjwt cryptography
          python3 ios/ci/asc_signing.py setup

      - name: Archive the Mac app
        run: |
          (cd apple && xcodegen generate)
          xcodebuild \
            -project apple/Bearings.xcodeproj \
            -scheme Bearings \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -archivePath "$RUNNER_TEMP/Mac.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $OOB_KEYCHAIN" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || true
          if [ ! -d "$RUNNER_TEMP/Mac.xcarchive" ]; then
            msg=$( (grep -E "error:" "$RUNNER_TEMP/archive.log" || tail -40 "$RUNNER_TEMP/archive.log") | sed -E 's#/Users/runner/work/[^/]+/[^/]+/##' | awk '!s[$0]++' | head -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=Mac archive errors::$msg"
            exit 1
          fi

      - name: Export and upload to TestFlight
        run: |
          python3 - <<'PY'
          import json, os, plistlib
          opts = {
              "method": "app-store-connect",
              "destination": "upload",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "installerSigningCertificate": "Mac Installer Distribution",
              "provisioningProfiles": json.loads(os.environ["OOB_PROFILE_MAP"]),
              "manageAppVersionAndBuildNumber": False,
          }
          plistlib.dump(opts, open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb"))
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Mac.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$RUNNER_TEMP/export.log" 2>&1 || true
          if ! grep -q "EXPORT SUCCEEDED\|Upload succeeded\|Uploaded" "$RUNNER_TEMP/export.log"; then
            msg=$( (grep -iE "error" "$RUNNER_TEMP/export.log" || tail -40 "$RUNNER_TEMP/export.log") | awk '!s[$0]++' | head -40 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=Mac upload errors::$msg"
            exit 1
          fi
          echo "::notice title=Mac TestFlight::Uploaded Mac build ${{ github.run_number }}"

      - name: Remove temporary signing
        if: always()
        run: |
          if [ -f "$ASC_KEY_PATH" ]; then python3 ios/ci/asc_signing.py cleanup || true; fi
