name: Bearings App Store listing

on:
  push:
    branches: [main]
    paths: ['store/**', '.github/workflows/store-listing.yml']
  workflow_dispatch:

concurrency:
  group: store-listing
  cancel-in-progress: true

jobs:
  listing:
    runs-on: macos-15
    timeout-minutes: 50
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8_RAW: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          python3 - "$RUNNER_TEMP/keys/key.p8" <<'PY'
          import os, re, sys, textwrap
          body = re.sub(r"[^A-Za-z0-9+/=]", "", re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", os.environ["ASC_KEY_P8_RAW"]))
          open(sys.argv[1], "w").write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n")
          PY
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/key.p8" >> "$GITHUB_ENV"
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography pillow 2>/dev/null || python3 -m pip install --quiet --user pyjwt cryptography pillow
      - name: Listing text and links
        continue-on-error: true
        run: python3 ios/ci/asc_listing.py text
      - name: Build the app for the simulator
        run: |
          npm ci && npm run build
          brew install xcodegen >/dev/null
          (cd apple && xcodegen generate)
          xcodebuild -project apple/Bearings.xcodeproj -scheme Bearings -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep error: build.log | head -40; exit 1; }
      - name: Capture App Store screenshots
        run: |
          APP=$(find build/dd/Build/Products -maxdepth 2 -name "Bearings.app" -path "*iphonesimulator*" | head -1)
          pick() { xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)['devices']; want=sys.argv[1]
          for rt in sorted(d, reverse=True):
              for x in d[rt]:
                  if re.fullmatch(want, x['name']): print(x['udid']); sys.exit()
          " "$1"; }
          PHONE=$(pick 'iPhone 1[6-9] Pro Max')
          PAD=$(pick 'iPad Pro 13-inch.*')
          mkdir -p raw
          for dev in $PHONE $PAD; do
            p=$([ "$dev" = "$PHONE" ] && echo phone || echo pad)
            xcrun simctl boot $dev || true
            xcrun simctl bootstatus $dev -b >/dev/null
            xcrun simctl status_bar $dev override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 || true
            xcrun simctl ui $dev appearance light
            xcrun simctl install $dev "$APP"
            python3 -c "import json; [print(n + ' ' + ' '.join(a)) for n, a, _ in json.load(open('store/listing.json'))['screens']]" | while read name args; do
              xcrun simctl terminate $dev com.jaynichols.networkoob >/dev/null 2>&1 || true
              xcrun simctl launch $dev com.jaynichols.networkoob -onboarded YES -storeMode YES $args >/dev/null
              sleep 8
              xcrun simctl io $dev screenshot "raw/$p-$name.png" >/dev/null 2>&1
            done
            xcrun simctl shutdown $dev || true
          done
          python3 store/frame.py raw framed 1320 2868 phone
          python3 store/frame.py raw framed 2064 2752 pad
          ls framed
      - name: Upload screenshots to App Store Connect
        continue-on-error: true
        run: python3 ios/ci/asc_listing.py screenshots framed
      - name: Publish framed screenshots to the store-screens branch
        continue-on-error: true
        run: |
          cd framed
          git init -q -b store-screens && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "store screens ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" store-screens
    permissions:
      contents: write
