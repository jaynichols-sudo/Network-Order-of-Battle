name: Bearings iOS + Mac → TestFlight

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: xcode-27  # Xcode 27.1: the iPhone Duo SDK
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Check secrets
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do [ -z "${!v}" ] && missing="$missing $v"; done
          [ -z "${{ secrets.ASC_KEY_P8 }}" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (see SETUP.md)"; exit 1; fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build shared engine
        run: |
          npm ci
          npm run build
          npm test

      - name: Generate Xcode project
        run: |
          brew install xcodegen >/dev/null
          cd apple && xcodegen generate

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8_RAW: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          # Normalize the pasted key: tolerate lost line breaks, CRLF, smart quotes or stray spaces.
          python3 - "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" <<'PY'
          import os, re, sys, textwrap
          raw = os.environ["ASC_KEY_P8_RAW"]
          body = re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          if len(body) < 100:
              sys.exit("ASC_KEY_P8 secret looks empty or truncated (%d base64 chars)" % len(body))
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n"
          open(sys.argv[1], "w").write(pem)
          print("API key normalized: %d base64 chars" % len(body))
          PY
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Create temporary App Store signing
        env:
          BUNDLE_IDS: APP=com.jaynichols.networkoob,WATCH=com.jaynichols.networkoob.watchkitapp,WIDGETS=com.jaynichols.networkoob.watchkitapp.widgets,HOMEWIDGETS=com.jaynichols.networkoob.widgets,SHARE=com.jaynichols.networkoob.share
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet --user pyjwt cryptography
          python3 ios/ci/asc_signing.py setup

      - name: Archive
        run: |
          # profile names come from the signing step; regenerate so they are filled in
          cd apple && xcodegen generate && cd ..
          xcodebuild \
            -project apple/Bearings.xcodeproj \
            -scheme Bearings \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $OOB_KEYCHAIN" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CONNECT_URL="${{ vars.CONNECT_URL }}" \
            archive | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|\*\* ARCHIVE" || true
          if [ ! -d "$RUNNER_TEMP/App.xcarchive" ]; then
            msg=$( (grep -E "error:" "$RUNNER_TEMP/archive.log" || tail -40 "$RUNNER_TEMP/archive.log") | sed -E 's#/Users/runner/work/[^/]+/[^/]+/##' | awk '!s[$0]++' | head -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=Archive errors::$msg"
            exit 1
          fi

      - name: Export and upload to TestFlight
        run: |
          python3 - <<'PY'
          import json, os, plistlib
          opts = {
              "method": "app-store-connect",
              "destination": "upload",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "provisioningProfiles": json.loads(os.environ["OOB_PROFILE_MAP"]),
              "uploadSymbols": True,
              "manageAppVersionAndBuildNumber": False,
          }
          plistlib.dump(opts, open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb"))
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log" | tail -40
          grep -q "EXPORT SUCCEEDED\|Upload succeeded\|Uploaded" "$RUNNER_TEMP/export.log" || exit 1

      - name: Set the App Store name
        continue-on-error: true
        env:
          NAMES: "Bearings|Bearings: Network Map|Bearings Network|Bearings: Know Your Network"
          SUBTITLE: "Your network, mapped"
        run: python3 ios/ci/asc_signing.py rename

      - name: Wait for TestFlight processing
        continue-on-error: true
        timeout-minutes: 15
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: python3 ios/ci/asc_signing.py status

      - name: Remove temporary signing
        if: always()
        run: |
          if [ -f "$ASC_KEY_PATH" ]; then python3 ios/ci/asc_signing.py cleanup || true; fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
