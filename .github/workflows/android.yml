name: Bearings Android build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'ios/**', '.github/workflows/ios-testflight.yml']
  workflow_dispatch:
    inputs:
      play_track:
        description: Also upload to Google Play (leave empty to skip)
        type: choice
        options: ['', internal, alpha]
        default: ''

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build web core
        run: |
          npm ci
          npm run build
          npm test
          npx cap sync android

      - name: Install signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Missing ANDROID_KEYSTORE_B64 secret (see SETUP.md)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK and app bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: bearings-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

      - name: Upload to Google Play
        if: ${{ inputs.play_track != '' && inputs.play_track != null }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.jaynichols.networkoob
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.play_track }}
          status: completed
