name: Native app compile check

on:
  push:
    branches: [main]
    paths: ['apple/**', 'src/**', '.github/workflows/apple-check.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build shared engine
        run: npm ci && npm run build
      - name: Generate Xcode project
        run: |
          brew install xcodegen >/dev/null
          cd apple && xcodegen generate
      - name: Compile for the simulator (no signing)
        run: |
          xcodebuild -version
          set -o pipefail
          xcodebuild -project apple/Bearings.xcodeproj -scheme Bearings -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee build.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED" build.log || { grep -E "error:" -A4 build.log | head -200; exit 1; }
