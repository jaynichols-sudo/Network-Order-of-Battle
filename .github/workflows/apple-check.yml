name: Native app compile check

on:
  push:
    branches: [main]
    paths: ['apple/**', 'src/**', '.github/workflows/apple-check.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build shared engine
        run: npm ci && npm run build
      - name: Generate Xcode project
        run: |
          brew install xcodegen >/dev/null
          cd apple && xcodegen generate
      - name: Compile for the simulator (no signing)
        run: |
          xcodebuild -version
          set -o pipefail
          xcodebuild -project apple/Bearings.xcodeproj -scheme Bearings -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee build.log | grep -E "error:|\*\* BUILD" || true
          if ! grep -q "\*\* BUILD SUCCEEDED" build.log; then
            python3 - <<'PY'
          import re
          log = open("build.log", errors="replace").read().splitlines()
          errs = [l for l in log if "error:" in l]
          if not errs: errs = log[-60:]
          seen, out = set(), []
          for l in errs:
              l = re.sub(r"^/Users/runner/work/[^/]+/[^/]+/", "", l.strip())
              if l not in seen: seen.add(l); out.append(l)
          msg = "%0A".join(x.replace("%", "%25").replace("\r", "") for x in out[:80])
          print("::error title=Build errors::" + msg)
          PY
            exit 1
          fi
