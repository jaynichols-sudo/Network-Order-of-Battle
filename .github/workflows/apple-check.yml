name: Bearings native app check

on:
  # run by hand from the Actions tab: Mac runners use build minutes ten times faster
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build shared engine
        run: npm ci && npm run build
      - name: Generate Xcode project
        run: |
          brew install xcodegen >/dev/null
          cd apple && xcodegen generate
      - name: Compile for the simulator (no signing)
        run: |
          xcodebuild -version
          xcodebuild -project apple/Bearings.xcodeproj -scheme Bearings -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          grep -E "\*\* BUILD" build.log || true
          if ! grep -q "\*\* BUILD SUCCEEDED" build.log; then
            python3 - <<'PY'
          import re
          log = open("build.log", errors="replace").read().splitlines()
          errs = [l for l in log if "error:" in l]
          if not errs: errs = log[-60:]
          seen, out = set(), []
          for l in errs:
              l = re.sub(r"^/Users/runner/work/[^/]+/[^/]+/", "", l.strip())
              if l not in seen: seen.add(l); out.append(l)
          msg = "%0A".join(x.replace("%", "%25").replace("\r", "") for x in out[:80])
          print("::error title=Build errors::" + msg)
          PY
            exit 1
          fi
      - name: Compile for Mac (Mac Catalyst, no signing)
        run: |
          xcodebuild -project apple/Bearings.xcodeproj -scheme Bearings -configuration Debug \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' -derivedDataPath build/ddmac CODE_SIGNING_ALLOWED=NO build > mac.log 2>&1 || true
          grep -E "\*\* BUILD" mac.log || true
          if ! grep -q "\*\* BUILD SUCCEEDED" mac.log; then
            msg=$( (grep -E "error:" mac.log || tail -40 mac.log) | sed -E 's#/Users/runner/work/[^/]+/[^/]+/##' | awk '!s[$0]++' | head -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=Mac build errors::$msg"
            exit 1
          fi
      - name: Screenshots
        continue-on-error: true
        run: |
          APP=$(find build/dd/Build/Products -maxdepth 2 -name "Bearings.app" -path "*iphonesimulator*" | head -1)
          echo "app: $APP"
          pick() { xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)['devices']; want=sys.argv[1]
          for rt in sorted(d, reverse=True):
              for x in d[rt]:
                  if re.fullmatch(want, x['name']): print(x['udid']); sys.exit()
          " "$1"; }
          PHONE=$(pick 'iPhone 1[6-9] Pro')
          PAD=$(pick 'iPad Pro 11-inch.*|iPad Air 11-inch.*')
          mkdir -p shots
          shoot() { # device name args...
            dev=$1; name=$2; shift 2
            xcrun simctl terminate $dev com.jaynichols.networkoob >/dev/null 2>&1 || true
            xcrun simctl launch $dev com.jaynichols.networkoob -onboarded YES "$@" >/dev/null
            sleep 7
            xcrun simctl io $dev screenshot "shots/$name.png" >/dev/null 2>&1
          }
          for dev in $PHONE $PAD; do
            [ -z "$dev" ] && continue
            xcrun simctl boot $dev || true
            xcrun simctl bootstatus $dev -b >/dev/null
            xcrun simctl status_bar $dev override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 || true
            xcrun simctl install $dev "$APP"
            p=$([ "$dev" = "$PHONE" ] && echo phone || echo pad)
            xcrun simctl ui $dev appearance light
            shoot $dev $p-01-home
            shoot $dev $p-02-people -startTab people
            shoot $dev $p-03-profile -startTab people -demoOpen person
            shoot $dev $p-04-companies -startTab companies
            shoot $dev $p-05-unit -startTab companies -demoOpen unit
            shoot $dev $p-06-industries -startTab companies -startCompanies industries
            shoot $dev $p-07-explore -startTab explore -exploreMode scope
            shoot $dev $p-07b-clusters -startTab explore -exploreMode clusters
            shoot $dev $p-07c-map -startTab explore -exploreMode map
            shoot $dev $p-08-catchup -startTab catchup
            shoot $dev $p-09-filters -startTab people -demoOpen filters
            shoot $dev $p-10-settings -demoOpen settings
            shoot $dev $p-11-import -demoOpen import
            shoot $dev $p-14-onboard-welcome -demoOpen onboarding
            shoot $dev $p-15-onboard-purpose -demoOpen onboarding -onboardStep 1
            shoot $dev $p-16-onboard-start -demoOpen onboarding -onboardStep 2
            shoot $dev $p-17-onboard-linkedin -demoOpen onboarding -onboardStep 3
            shoot $dev $p-18-share -demoOpen share
            xcrun simctl ui $dev appearance dark
            shoot $dev $p-12-home-dark
            shoot $dev $p-13-people-dark -startTab people
            xcrun simctl terminate $dev com.jaynichols.networkoob >/dev/null 2>&1 || true
            xcrun simctl launch $dev com.jaynichols.networkoob -onboarded NO >/dev/null; sleep 6
            xcrun simctl io $dev screenshot "shots/$p-00-welcome-dark.png" >/dev/null 2>&1
            xcrun simctl ui $dev appearance light
            xcrun simctl shutdown $dev || true
          done
          # Apple Watch: install the watch app on its own and feed it the sample snapshot
          WATCH=$(pick 'Apple Watch Series (1[0-9]) \(46mm\)|Apple Watch Ultra.*')
          WAPP="$APP/Watch/Bearings.app"
          if [ -n "$WATCH" ] && [ -d "$WAPP" ]; then
            node scripts/watch-sample.mjs watch-sample.json
            xcrun simctl boot $WATCH || true
            xcrun simctl bootstatus $WATCH -b >/dev/null
            xcrun simctl install $WATCH "$WAPP"
            xcrun simctl launch $WATCH com.jaynichols.networkoob.watchkitapp >/dev/null; sleep 4
            xcrun simctl terminate $WATCH com.jaynichols.networkoob.watchkitapp || true
            C=$(xcrun simctl get_app_container $WATCH com.jaynichols.networkoob.watchkitapp data)
            mkdir -p "$C/Documents" && cp watch-sample.json "$C/Documents/snapshot.json"
            wshot() { xcrun simctl terminate $WATCH com.jaynichols.networkoob.watchkitapp >/dev/null 2>&1 || true; xcrun simctl launch $WATCH com.jaynichols.networkoob.watchkitapp "$@" >/dev/null; sleep 6; }
            wshot; xcrun simctl io $WATCH screenshot shots/watch-01-home.png
            wshot -watchOpen waiting; xcrun simctl io $WATCH screenshot shots/watch-02-waiting.png
            wshot -watchOpen person; xcrun simctl io $WATCH screenshot shots/watch-03-person.png
          else
            echo "no watch simulator ($WATCH) or watch app ($WAPP)"; ls "$APP" || true
          fi
          ls shots
      - name: Publish screenshots to the ci-screens branch
        continue-on-error: true
        run: |
          cd shots
          git init -q -b ci-screens
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          echo "${{ github.sha }}" > SHA
          git add -A && git commit -qm "screens ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screens
